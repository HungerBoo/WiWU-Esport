name: Update player stats

on:
  workflow_dispatch:

  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Statistiken aktualisieren
        env:
          STARTGG_API_TOKEN: ${{ secrets.STARTGG_API_TOKEN }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: npm run update-stats

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/event-cache.json data/riot-cache.json public/data/players.json
          git diff --cached --quiet && exit 0
          git commit -m "Update player stats (start.gg & Riot)"
          git push
